name: Livraria CI Pipeline

on:
  # Dispara automaticamente ao enviar novos commits para a branch main
  push:
    branches:
      - main
  # Dispara na abertura ou atualizacao de Pull Requests direcionados para a branch main
  pull_request:
    branches:
      - main
  # Permite execucao manual pelo painel web do GitHub (aba Actions -> Run workflow)
  workflow_dispatch:

jobs:
  qualidade-e-build-livraria:
    name: Validar Padronização, Tipos, Backend e Docker
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o codigo fonte
        uses: actions/checkout@v4

      - name: 2. Habilitar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 3. Configurar o Node.js 24 com Cache de Dependencias
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: 4. Instalar Dependencias do Backend
        run: |
          cd backend
          pnpm install --frozen-lockfile

      - name: 5. Validar Padronizacao de Codigo (ESLint)
        run: |
          cd backend
          pnpm run lint

      - name: 6. Validar Formatacao de Arquivos (Prettier)
        run: |
          cd backend
          pnpm run format:check

      - name: 7. Validar Tipos e Compilar o Backend (Express)
        run: |
          cd backend
          pnpm run build

      - name: 8. Validar Construção da Imagem Docker da API
        run: |
          docker build -t api-service:test ./backend

      - name: 9. Resumo da execução
        run: |
          echo "Integração Continua concluida com sucesso!"
          echo "Autor da alteração: ${{ github.actor }}"
          echo "Commit validado: ${{ github.sha }}"