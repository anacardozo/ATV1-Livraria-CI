name: Livraria CI Pipeline

on:
  # Dispara automaticamente ao enviar novos commits para a branch main
  push:
    branches:
      - main
  # Dispara na abertura ou atualizacao de Pull Requests direcionados para a branch main
  pull_request:
    branches:
      - main
  # Permite execucao manual pelo painel web do GitHub (aba Actions -> Run workflow)
  workflow_dispatch:

jobs:
  validar-livraria:
    name: Validar Backend, Frontend e Docker
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o codigo fonte
        uses: actions/checkout@v4

      - name: 2. Habilitar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 3. Configurar o Node.js 24 com Cache de Dependencias
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: 4. Instalar Dependencias do Backend
        run: |
          cd backend
          pnpm install --frozen-lockfile

      - name: 5. Validar Tipos e Compilar o Backend (Express)
        run: |
          cd backend
          pnpm run build

      - name: 6. Validar Construcao da Imagem Docker da API
        run: |
          docker build -t api-service:test ./backend

      - name: 7. Validar Frontend (quando presente no projeto da livraria)
        run: |
          if [ -d "app" ]; then
            echo "Subprojeto frontend encontrado. Iniciando validacao..."
            cd app
            pnpm install --frozen-lockfile
            pnpm run build
            docker build -t app-service:test ./app
          else
            echo "Subprojeto app ainda nao adicionado ao projeto livraria. Etapa concluida."
          fi

      - name: 8. Resumo da Execucao
        run: |
          echo "Integracao Continua concluida com sucesso!"
          echo "Autor da alteracao: ${{ github.actor }}"
          echo "Commit validado: ${{ github.sha }}"